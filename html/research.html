    <main id="research" class="research-list" aria-label="Research">

    <footer class="site-footer">

            <p>
                Never doubt that a small group of thoughtful, committed people can change the world. Indeed, it is the
                only thing that ever has. ~ Margaret Mead
            </p>
        </div>
    </footer>

    <script>
        const researchList = document.querySelector('#research');

        function addText(parent, tagName, className, text) {
            const element = document.createElement(tagName);
            element.className = className;
            element.textContent = text;
            parent.appendChild(element);
            return element;
        }

        function createSection(title) {
            const section = document.createElement('section');
            section.className = 'research-section';
            addText(section, 'h2', 'people-divider', title);
            return section;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function formatCurrency(amount) {
            if (!amount) return '';
            return new Intl.NumberFormat('en-US', { 
                style: 'currency', 
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount);
        }

        function formatInvestigators(grant) {
            const investigators = [];
            
            if (grant.principal_investigator && grant.principal_investigator.name) {
                investigators.push(grant.principal_investigator.name + ' (PI)');
            }
            
            if (grant.co_principal_investigators && Array.isArray(grant.co_principal_investigators)) {
                grant.co_principal_investigators.forEach((cpi) => {
                    if (cpi.name) {
                        investigators.push(cpi.name + (cpi.former ? ' (former)' : ''));
                    }
                });
            }
            
            return investigators.join('; ');
        }

        function createGrantBlock(grant) {
            const block = document.createElement('article');
            block.className = 'grant-block';

            const provider = document.createElement('div');
            provider.className = 'grant-provider';

            // Add NSF logo or placeholder
            const image = document.createElement('img');
            image.src = '../public/nsf.png';
            image.alt = 'NSF Award';
            image.loading = 'lazy';
            image.style.maxWidth = '120px';
            provider.appendChild(image);

            const details = document.createElement('div');
            details.className = 'grant-details';

            // Create title as a link
            const titleHeading = document.createElement('h3');
            titleHeading.className = 'grant-name';
            if (grant.award_url) {
                const titleLink = document.createElement('a');
                titleLink.href = grant.award_url;
                titleLink.textContent = grant.title;
                titleLink.target = '_blank';
                titleLink.rel = 'noopener noreferrer';
                titleHeading.appendChild(titleLink);
            } else {
                titleHeading.textContent = grant.title;
            }
            details.appendChild(titleHeading);

            addText(details, 'p', 'grant-provider-name', grant.organization);

            const meta = document.createElement('dl');
            meta.className = 'grant-meta';

            addText(meta, 'dt', '', 'Start Date');
            addText(meta, 'dd', '', formatDate(grant.start_date));
            addText(meta, 'dt', '', 'Award No.');
            addText(meta, 'dd', '', grant.award_number);
            addText(meta, 'dt', '', 'Amount');
            addText(meta, 'dd', '', formatCurrency(grant.award_amount_usd));
            addText(meta, 'dt', '', 'NSF Organization');
            addText(meta, 'dd', '', grant.nsf_organization || 'N/A');
            details.appendChild(meta);

            const investigators = formatInvestigators(grant);
            if (investigators) {
                addText(details, 'p', 'grant-investigators', investigators);
            }

            // Add abstract/description as a dropdown
            const description = grant.abstract || grant.project_description;
            if (description) {
                const abstractDetails = document.createElement('details');
                abstractDetails.className = 'grant-abstract';
                
                const summary = document.createElement('summary');
                summary.textContent = 'Abstract';
                abstractDetails.appendChild(summary);
                
                const abstractPara = document.createElement('p');
                abstractPara.textContent = description;
                abstractDetails.appendChild(abstractPara);
                
                details.appendChild(abstractDetails);
            }

            block.appendChild(provider);
            block.appendChild(details);

            return block;
        }

        fetch('../research_data.json')
            .then((response) => {
                if (!response.ok) {
                    throw new Error('Unable to load research data.');
                }

                return response.json();
            })
            .then((data) => {
                const grantsSection = createSection('Grants');
                const grants = data.grants || [];

                if (grants.length === 0) {
                    addText(grantsSection, 'p', 'research-empty', 'No grants listed yet.');
                } else {
                    grants.forEach((grant) => {
                        grantsSection.appendChild(createGrantBlock(grant));
                    });
                }

                researchList.appendChild(grantsSection);
            })
            .catch(() => {
                addText(researchList, 'p', 'people-error', 'Research information is unavailable right now.');
            });
    </script>
</body>

</html>
