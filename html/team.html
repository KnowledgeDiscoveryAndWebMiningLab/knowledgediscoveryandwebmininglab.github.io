<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../stylesheets/animation.css">
  <link rel="stylesheet" href="../stylesheets/stylesheet.css">
  <title>Team | KDWM Lab</title>
</head>

<body>
  <section class="hero hero-compact">
    <div class="flower">
      <div class="petal" style="--i: 0; --angle: 180deg; --height: 330px; --color: #ff3b18;"></div>
      <div class="petal" style="--i: 1; --angle: 165deg; --height: 390px; --color: #ff7a00;"></div>
      <div class="petal" style="--i: 2; --angle: 150deg; --height: 440px; --color: #ffd500;"></div>
      <div class="petal" style="--i: 3; --angle: 135deg; --height: 470px; --color: #b6e400;"></div>
      <div class="petal" style="--i: 4; --angle: 120deg; --height: 500px; --color: #53d500;"></div>
      <div class="petal" style="--i: 5; --angle: 105deg; --height: 520px; --color: #00ca59;"></div>
      <div class="petal" style="--i: 6; --angle: 90deg; --height: 540px; --color: #00b7a3;"></div>
      <div class="petal" style="--i: 7; --angle: 75deg; --height: 520px; --color: #00a7dd;"></div>
      <div class="petal" style="--i: 8; --angle: 60deg; --height: 500px; --color: #168cff;"></div>
      <div class="petal" style="--i: 9; --angle: 45deg; --height: 470px; --color: #4d5cff;"></div>
      <div class="petal" style="--i: 10; --angle: 30deg; --height: 440px; --color: #7e35e8;"></div>
      <div class="petal" style="--i: 11; --angle: 15deg; --height: 390px; --color: #d32bcf;"></div>
      <div class="petal" style="--i: 12; --angle: 0deg; --height: 330px; --color: #ef337d;"></div>
      <div class="flower-center"></div>
    </div>

    <div class="hero-content">
      <h1>
        <span class="sheen-word">Knowledge</span> <span class="sheen-word">Discovery</span><br>
        <span class="sheen-word">&amp;</span> <span class="sheen-word">Web</span> <span class="sheen-word">Mining</span> <span class="sheen-word">Lab</span>
      </h1>
      <img
        class="hero-logo"
        src="../public/UL_oneline_whiteonblack-RGB.webp"
        alt="University of Louisville"
      >
    </div>
  </section>

  <nav>
    <a href="../index.html">Home</a>
    <a href="team.html">Team</a>
    <a href="research.html">Research</a>
  </nav>

  <main id="people" class="people-list" aria-label="Team members"></main>

  <footer class="site-footer">
      <p>
        "<i>Never doubt that a small group of thoughtful, committed people can change the world. Indeed, it is the only
        thing that ever has.</i>" — Margaret Mead
      </p>
  </footer>

  <script>
    const peopleList = document.querySelector('#people');

    function getInitials(name) {
      return name
        .split(' ')
        .filter(Boolean)
        .map((part) => part.charAt(0))
        .join('')
        .slice(0, 2);
    }

    function addText(parent, tagName, className, text) {
      if (!text) return;

      const element = document.createElement(tagName);
      element.className = className;
      element.textContent = text;
      parent.appendChild(element);
    }

    function resolveImagePath(path) {
      if (/^(https?:)?\/\//.test(path) || path.startsWith('data:')) {
        return path;
      }

      return new URL(`../${path.replace(/^\.?\//, '')}`, window.location.href).href;
    }

    function createPersonBlock(person, headingLevel = 3) {
      const block = document.createElement('article');
      block.className = 'person-block';
      if (person.role === 'Founder and PI') {
        block.classList.add('person-block-featured');
      }

      const imageWrap = document.createElement('div');
      imageWrap.className = 'person-image';

      if (person.image) {
        const image = document.createElement('img');
        image.src = resolveImagePath(person.image);
        image.alt = person.name;
        image.loading = 'lazy';
        image.addEventListener('error', () => {
          image.remove();
          imageWrap.textContent = getInitials(person.name);
          imageWrap.className += ' person-image-initials' // Add class for initials
        });
        imageWrap.appendChild(image);
      } else {
        imageWrap.textContent = getInitials(person.name);
        imageWrap.className += ' person-image-initials' // Add class for initials
      }

      const details = document.createElement('div');
      details.className = 'person-details';

      addText(details, `h${headingLevel}`, 'person-name', person.name);
      addText(details, 'p', 'person-role', person.role);
      addText(details, 'p', 'person-date', person.date);
      addText(details, 'p', 'person-bio', person.bio);

      block.appendChild(imageWrap);
      block.appendChild(details);

      return block;
    }

    function createPeopleSection(title, people, headingLevel = 2) {
      const section = document.createElement('section');
      section.className = 'people-section';
      if (headingLevel > 2) {
        section.classList.add('people-subsection');
      }

      const heading = document.createElement(`h${headingLevel}`);
      heading.className = 'people-divider';
      heading.textContent = title;
      section.appendChild(heading);

      if (people.length === 0) {
        addText(section, 'p', 'people-empty', 'No members listed yet.');
      } else {
        const grid = document.createElement('div');
        grid.className = 'people-grid';
        people.forEach((person) => {
          grid.appendChild(createPersonBlock(person, headingLevel + 1));
        });
        section.appendChild(grid);
      }

      return section;
    }

    function createAlumniSection(people) {
      if (people.length === 0) {
        return createPeopleSection('Alumni', people);
      }

      const section = document.createElement('section');
      section.className = 'people-section';
      addText(section, 'h2', 'people-divider', 'Alumni');

      const roleTitles = new Map([
        ['phd student', 'PhD Students'],
        ['masters student', 'Masters Students'],
        ['undergraduate', 'Undergraduates'],
        ['undergraduate (reu)', 'Undergraduates (REU)'],
        ['postdoc', 'Postdocs'],
        ['fullbright postdoc scholar', 'Fullbright Postdoc Scholars']
      ]);
      const groups = new Map();

      people.forEach((person) => {
        const role = (person.role || '').trim();
        const key = role.toLowerCase();
        if (!groups.has(key)) {
          groups.set(key, { title: roleTitles.get(key) || role || 'Other Alumni', people: [] });
        }
        groups.get(key).people.push(person);
      });

      // Show known roles in academic order, followed by any new roles in the data.
      const roleOrder = new Set([...roleTitles.keys(), ...groups.keys()]);
      roleOrder.forEach((key) => {
        const group = groups.get(key);
        if (group) {
          section.appendChild(createPeopleSection(group.title, group.people, 3));
        }
      });

      return section;
    }

    fetch('../teams_data.json')
      .then((response) => {
        if (!response.ok) {
          throw new Error('Unable to load team data.');
        }

        return response.json();
      })
      .then((data) => {
        peopleList.appendChild(createPeopleSection('Current Members', data.current || []));
        peopleList.appendChild(createAlumniSection(data.alumni || []));
      })
      .catch(() => {
        addText(peopleList, 'p', 'people-error', 'Team information is unavailable right now.');
      });
  </script>
</body>
</html>
